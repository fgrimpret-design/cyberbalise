# Déploiement automatique de cyberbalise.fr vers l'espace web IONOS
# Déclenché à chaque push sur la branche main.

name: "Déploiement cyberbalise.fr vers IONOS"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  deploy:
    name: Synchroniser le site via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Node pour minifier le détecteur d'arnaque
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Minifier les scripts du détecteur d'arnaque (regles, moteur, ui)
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts terser@5.51.2
          node scripts/minify-detecteur.mjs --en-place

      - name: Nettoyage des fichiers non destinés au site
        run: |
          rm -rf .git .github scripts tests node_modules package.json package-lock.json backoffice/data/brouillons domaines.csv \
                 urls_cyberbalise_categorisees.xls installer*.php desktop.ini || true

      - name: Synchronisation SFTP vers IONOS
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.IONOS_SFTP_HOST }}
          username: ${{ secrets.IONOS_SFTP_USER }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          port: 22
          local_path: ./*
          remote_path: /Newpublic
          sftp_only: true

      - name: Supprimer du serveur les pages retirees du depot
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp > /dev/null
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST:22" -e "set sftp:auto-confirm yes; set cmd:fail-exit no; rm -f /Newpublic/outils/risque-sms/index.html; rmdir /Newpublic/outils/risque-sms; bye"
